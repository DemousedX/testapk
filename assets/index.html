<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Clicker</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="bg">
    <div class="grain"></div>
    <div class="vignette"></div>
  </div>

  <header class="topbar">
    <div class="stat">
      <div class="label">Сила</div>
      <div id="power" class="value">1</div>
    </div>
    <div class="stat">
      <div class="label">Комбо</div>
      <div id="combo" class="value">x1</div>
    </div>
    <button id="settingsBtn" class="iconBtn" aria-label="Налаштування">⚙️</button>
  </header>

  <main class="wrap">
    <div class="scoreBlock">
      <div class="scoreLabel">Твої монети</div>
      <div id="score" class="score">0</div>
      <div id="rate" class="rate">+0 / сек</div>
    </div>

    <button id="tapBtn" class="tapBtn">
      <div class="orb">
        <div class="orbGlow"></div>
        <div class="orbCore"></div>
      </div>
      <div class="tapHint">TAP</div>
    </button>

    <section class="shop">
      <div class="shopHead">
        <div class="shopTitle">Прокачка</div>
        <div class="shopSub">Зроби наступний клік відчутним</div>
      </div>

      <div class="cards">
        <button class="card" id="buyPower">
          <div class="cardTitle">Сила кліку</div>
          <div class="cardDesc">+1 монета за тап</div>
          <div class="cardMeta">
            <span id="powerCost" class="cost">10</span>
            <span class="tag">🖱️</span>
          </div>
        </button>

        <button class="card" id="buyAuto">
          <div class="cardTitle">Автоклік</div>
          <div class="cardDesc">+1 / сек</div>
          <div class="cardMeta">
            <span id="autoCost" class="cost">25</span>
            <span class="tag">⏱️</span>
          </div>
        </button>

        <button class="card" id="buyCrit">
          <div class="cardTitle">Крит-шанс</div>
          <div class="cardDesc">рідкісні супер-тапи</div>
          <div class="cardMeta">
            <span id="critCost" class="cost">40</span>
            <span class="tag">💥</span>
          </div>
        </button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="game.js"></script>
</body>
</html>
