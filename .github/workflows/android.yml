name: Build Android APK (Kivy/Buildozer)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            build-essential ccache \
            libffi-dev libssl-dev \
            libsqlite3-dev zlib1g-dev \
            python3-dev

      - name: Setup Android SDK (gives us sdkmanager)
        uses: android-actions/setup-android@v3

      - name: Install Android packages into Buildozer SDK path (fix AIDL)
        run: |
          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BUILDOZER_SDK"

          # accept licenses for sdkmanager
          yes | sdkmanager --licenses

          # install packages into the EXACT sdk root buildozer searches
          sdkmanager --sdk_root="$BUILDOZER_SDK" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "Installed into: $BUILDOZER_SDK"
          ls -la "$BUILDOZER_SDK/build-tools/34.0.0" || true
          test -f "$BUILDOZER_SDK/build-tools/34.0.0/aidl"
          echo "$BUILDOZER_SDK/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build debug APK
        env:
          # force p4a/buildozer to look here
          ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          which aidl || true
          aidl --version || true
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clicker-apk
          path: |
            bin/*.apk
            **/bin/*.apk
