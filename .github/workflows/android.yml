name: Build Android APK (Kivy/Buildozer)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Android SDK (includes sdkmanager)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Ensure Build Tools are installed and aidl is on PATH
      - name: Install Android packages (build-tools includes aidl)
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> $GITHUB_PATH
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_SDK_ROOT/build-tools/34.0.0" || true
          which aidl || true
          aidl --version || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            build-essential ccache \
            libffi-dev libssl-dev \
            libsqlite3-dev zlib1g-dev \
            python3-dev

      - name: Install Buildozer + deps
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build debug APK
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clicker-apk
          path: |
            bin/*.apk
            **/bin/*.apk